// BanxiaFlutterHost: local flatDir so the conditional AAR dependency above can
// resolve. Unity's **REPOSITORIES** already injects flatDir 'libs'; this block
// is belt-and-braces and merges harmlessly with it.
repositories {
    flatDir {
        dirs 'libs'
    }
